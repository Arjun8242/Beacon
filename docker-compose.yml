
services:
  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: uptime_monitor
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  notifier:
    image: beacon-notifier:latest
    build:
      context: .
      dockerfile: apps/notifier/dockerfile
    environment:
      DATABASE_URL: postgresql://admin:password@postgres:5432/uptime_monitor
      REDIS_URL: redis://redis:6379
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-alerts@beacon.dev}
    depends_on:
      - postgres
      - redis

  # Two scheduler instances to test race condition.
  scheduler-1:
    image: beacon-scheduler:latest
    build:
      context: .
      dockerfile: apps/scheduler/dockerfile
    environment:
      DATABASE_URL: postgresql://admin:password@postgres:5432/uptime_monitor
      REDIS_URL: redis://redis:6379
    depends_on:
      - postgres
      - redis

  scheduler-2:
    image: beacon-scheduler:latest
    build:
      context: .
      dockerfile: apps/scheduler/dockerfile
    environment:
      DATABASE_URL: postgresql://admin:password@postgres:5432/uptime_monitor
      REDIS_URL: redis://redis:6379
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
