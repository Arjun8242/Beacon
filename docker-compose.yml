version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: uptime_monitor
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  notifier:
    build:
      context: .
      dockerfile: apps/notifier/Dockerfile
    environment:
      DATABASE_URL: postgresql://admin:password@postgres:5432/uptime_monitor
      REDIS_URL: redis://redis:6379
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-alerts@beacon.dev}
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:

